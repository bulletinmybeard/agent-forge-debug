<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>AgentForge Debug</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121a24"/>
      <stop offset="100%" stop-color="#0a0e13"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed tile; macOS applies mask. -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <!-- Log lines + magnifier (inspect a session) -->
  <g fill="none" stroke="#5aa0f7" stroke-width="56" stroke-linejoin="round" stroke-linecap="round">
    <path d="M176 280 H560"/>
    <path d="M176 420 H480"/>
    <path d="M176 560 H400"/>
    <circle cx="640" cy="560" r="168"/>
    <path d="M760 680 L880 800"/>
  </g>
</svg>
